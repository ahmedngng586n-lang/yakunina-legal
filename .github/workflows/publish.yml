name: Refresh static preview
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify application
        run: python -m unittest discover -s server -p 'test_*.py' -v
      - name: Refresh Pages files from current sources
        run: |
          python - <<'PY'
          import pathlib, shutil
          shutil.copytree('dist', 'docs', dirs_exist_ok=True)
          pathlib.Path('docs/.nojekyll').touch()
          PY
      - name: Commit static preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Refresh legal landing static preview"
          git push
