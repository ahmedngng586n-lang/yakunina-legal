name: Publish reviewed v2.1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import reviewed sources
        run: |
          python - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('yakunina-legal-site.zip') as z:
              for item in z.infolist():
                  p = pathlib.PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts or p.parts[0] != 'yakunina-legal':
                      raise ValueError('Invalid archive path')
                  if item.is_dir(): continue
                  target = pathlib.Path(*p.parts[1:])
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(item))
          PY
      - name: Verify release
        run: |
          python -m unittest discover -s server -p 'test_*.py' -q
          for source in dist/assets/app.js dist/assets/callback.js dist/assets/motion.js; do node --check "$source"; done
      - name: Commit sources and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist docs server deploy .github README.md REVIEW.md MOTION.md EDIT-CONTENT.md direct-setup.md market-prices.md start-local.ps1 Dockerfile .dockerignore .gitignore
          git diff --cached --quiet || git commit -m 'Release v2.1: motion, pricing, consent and CRM fixes'
          git push
          gh release create v2.1.0 yakunina-legal-site.zip --target main --title 'v2.1 — Motion, pricing and private intake' --notes 'Animated landing with local GSAP and verified Figma motion study. Three scoped legal service formats, neutral actions, separate privacy and consent documents, current consent checks and bounded CRM retention. 24 regression tests pass. HTTPS deployment: https://yakunina.153-52-103-26.sslip.io/ . Review: REVIEW.md. Figma: https://www.figma.com/design/vufFTfJJltVSwqonwnwF1e . Secrets and intake data are excluded.'
