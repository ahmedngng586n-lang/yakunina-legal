name: Publish multi-page SEO v3.0.0
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import reviewed sources
        run: |
          python - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('yakunina-legal-site.zip') as z:
              for item in z.infolist():
                  p = pathlib.PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts or p.parts[0] != 'yakunina-legal':
                      raise ValueError('Invalid archive path')
                  if item.is_dir(): continue
                  if p.parts[1] == '.github': continue
                  target = pathlib.Path(*p.parts[1:])
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(item))
          PY
      - name: Verify release
        run: |
          python verify_site.py
          python -m unittest discover -s server -p 'test_*.py' -q
          for source in dist/assets/*.js; do node --check "$source"; done
      - name: Commit sources and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content build_site.py verify_site.py SEO-V3.md seo dist docs server deploy README.md REVIEW.md MOTION.md EDIT-CONTENT.md direct-setup.md market-prices.md start-local.ps1 Dockerfile .dockerignore .gitignore
          git diff --cached --quiet || git commit -m 'Build complete local SEO practice site with clean service URLs'
          git push
          gh release create v3.0.0 yakunina-legal-site.zip --target main --title 'v3.0.0 — Legal practice and local SEO' --notes '16 canonical pages, six complete service descriptions and FAQs, local semantic map, booking with Russian phone validation, clean URLs and legacy redirects. Primary site: https://obz-pravo.ru/ . Public sources only; no credentials or intake data.'
