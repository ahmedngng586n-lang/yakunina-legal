server {
    listen 80;
    listen [::]:80;
    server_name yakunina.153-52-103-26.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yakunina.153-52-103-26.sslip.io;
    ssl_certificate /etc/letsencrypt/live/yakunina-legal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yakunina-legal/privkey.pem;
    client_max_body_size 32k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:9138;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 65s;
    }
}
